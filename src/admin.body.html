<header>
  <div class="kicker">2026학년도 제1회 SEED Conference · 지능정보교육부</div>
  <h1>담당자 관리 페이지</h1>
  <p>전체 현황 확인, 엑셀 내려받기, 잘못 제출된 신청·파일·회신 삭제를 합니다.</p>
</header>
<form id="login" class="card" novalidate><h2>관리자 로그인</h2>
  <div class="field"><label for="pw">관리자 비밀번호</label><input type="password" id="pw" autocomplete="current-password"></div>
  <div class="actions"><button type="submit" class="primary" id="enter">로그인</button></div>
  <div id="lmsg" class="msg" role="status"></div>
</form>
<div id="app" class="hidden">
  <div class="tabs"><button type="button" class="primary" id="xlsx">엑셀로 내려받기</button><button type="button" id="reload">새로고침</button><button type="button" id="logout" class="right">로그아웃</button></div>
  <div class="stats" id="stats"></div>
  <div id="dmsg" class="msg" role="status"></div>
  <div class="card"><h2>신청 팀·제출 현황</h2>
    <div class="filters"><select id="fArea"><option value="">전체 분야</option></select><input type="text" id="fQ" maxlength="20" placeholder="학번·이름·주제 검색"></div>
    <div class="hint">팀을 삭제하면 그 팀의 제출 파일도 함께 지워지고, 학생들이 다시 신청할 수 있게 됩니다. 파일만 삭제하면 그 단계만 다시 제출할 수 있습니다.</div>
    <div class="tablewrap" id="teams"></div></div>
  <div class="card"><h2>1학년 반별 신청 현황 · 미신청 학생</h2><div id="classes"></div></div>
  <div class="card"><h2>지도교사 회신</h2><div class="tablewrap" id="replies"></div></div>
</div>
