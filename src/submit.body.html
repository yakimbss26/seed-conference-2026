<header>
  <div class="kicker">2026학년도 제1회 SEED Conference</div>
  <h1>산출물 제출 (학생용)</h1>
  <p>팀장 학번과 신청할 때 받은 <b>팀 코드</b>로 들어와 단계별 파일을 제출합니다.</p>
</header>
<div class="notice">
  단계마다 <b>한 번만</b> 제출할 수 있습니다. 잘못 냈으면 담당 선생님께 삭제를 요청한 뒤 다시 내세요.<br>
  파일 이름은 자동으로 <b>SEED_단계_팀원 전체 학번이름</b>으로 바뀌어 저장됩니다. 파일은 15MB 이하만 낼 수 있습니다.
</div>
<form id="login" class="card" novalidate><h2>팀 확인</h2>
  <div class="grid2">
    <div class="field"><label for="lid">팀장 학번</label><input type="text" id="lid" inputmode="numeric" maxlength="4" placeholder="예) 1211" autocomplete="off"></div>
    <div class="field"><label for="code">팀 코드</label><input type="text" id="code" maxlength="6" placeholder="6자리" autocomplete="off"></div>
  </div>
  <div class="actions"><button type="submit" class="primary" id="enter">확인</button></div>
  <div id="lmsg" class="msg" role="status"></div>
</form>
<div id="team" class="hidden">
  <div class="card"><h2>우리 팀</h2><div id="teamInfo"></div></div>
  <div class="card"><h2>단계별 제출</h2><div id="stages"></div><div id="smsg" class="msg" role="status"></div></div>
  <div class="actions"><button type="button" id="out">나가기</button></div>
</div>
